name: OpenWrt-CI

on:
  push:
    
jobs:

  build_openwrt:

    name: Build OpenWrt Firmware

    runs-on: ubuntu-24.04

    steps:
      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt update
          sudo -E apt -y full-upgrade
          sudo -E apt -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
          
      - name: Checkout OpenWrt
        uses: actions/checkout@v3
        with:
          repository: 'openwrt/openwrt'
          ref: 'openwrt-25.12'

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate configuration file
        run: |
          wget https://downloads.openwrt.org/releases/25.12.5/targets/qualcommax/ipq807x/config.buildinfo -O .config
          wget https://raw.githubusercontent.com/coolsnowwolf/lede/refs/heads/master/target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq8071-ax6.dts -O ./target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq8071-ax6.dts
          make defconfig

      - name: Download packages
        run: make download -j8

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j4 V=s
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin

      - name: Prepare artifact
        run: |
          mkdir -p ./artifact/buildinfo
          rm -rf $(find ./bin/targets/ -type d -name "packages")
          cp -rf $(find ./bin/targets/ -type f -name "*.buildinfo" -o -name "*.manifest") ./artifact/buildinfo/

  

      - name: Upload buildinfo
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_buildinfo
          path: ./artifact/buildinfo/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware
          path: ./bin/targets/qualcommax/ipq807x/*redmi*
